# Конфигурация инструментов проверки. Держим её в проекте, а не в головах:
# у следующего человека ruff и mypy должны вести себя так же, как у автора.

[tool.ruff]
line-length = 100          # 79 из PEP8 тесноват для русских комментариев
target-version = "py310"

[tool.ruff.lint]
# E,W — PEP8; F — реальные ошибки; I — порядок импортов; UP — устаревшие конструкции.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
# Полная типизация — требование ТЗ урока. Проверяем в том числе функции без
# аннотаций: иначе mypy молча пропускает целые файлы и проверка становится
# декоративной.
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
